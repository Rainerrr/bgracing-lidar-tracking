name: verify

# Reviewer flow on a real amd64 Linux runner: download the drive, build both images, run verify.sh.
# No secrets are used and the token is read-only.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the drive (README step 1)
        run: ./scripts/download_kitti.sh

      - name: Platform
        run: |
          uname -m
          docker compose build
          for svc in publisher processor; do
            echo "== $svc"
            docker compose run --rm --no-deps --entrypoint bash "$svc" -c 'grep PRETTY_NAME /etc/os-release; python3 --version'
          done

      - name: verify.sh (build, smoke import, tests, sample byte comparison)
        run: ./scripts/verify.sh

      # The reviewer's evaluation command, then the committed sample must match byte for byte.
      - name: evaluate.py and diff against docs/samples
        run: |
          docker compose run --rm --no-deps processor python3 /app/scripts/evaluate.py
          diff output/evaluation.md docs/samples/evaluation.md && echo "evaluation.md matches the sample"
          docker compose run --rm --no-deps processor python3 /app/scripts/dataset_stats.py
          cmp output/dataset_stats.json docs/samples/dataset_stats.json && echo "dataset_stats.json matches the sample"

      # Headless live run: publisher + processor on the compose bridge network, then a clean stop and complete output files.
      - name: Live run, stop, check the output files
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do
            docker compose logs processor 2>&1 | grep -q "processed=100 " && break
            sleep 3
          done
          docker compose logs processor 2>&1 | grep -E "processed=100 |Server listening" | head -5
          docker compose exec -T processor bash -c 'source /opt/ros/jazzy/setup.bash && ros2 topic list --no-daemon --spin-time 5' | tee topics.txt
          grep -q /perception/ego_vehicle topics.txt
          grep -q /perception/bounding_boxes topics.txt
          docker compose down
          docker compose run --rm --no-deps processor python3 /app/scripts/live_check.py files

      # The host user (the runner, not root) can read and delete everything the containers wrote.
      - name: Host user can read and delete output/
        run: |
          id
          ls -lnR output | head -40
          test -z "$(find output -type f ! -readable)"
          find output -mindepth 1 ! -name .gitkeep -delete
          test -z "$(find output -mindepth 1 ! -name .gitkeep)" && echo "output/ is empty again"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -150
