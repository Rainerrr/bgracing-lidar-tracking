# Parameters for obstacle_tracker_node and scripts/run_offline.py (one source, see docs/spec.md).
# Every key is required; a missing or unknown key is an error that names it.
obstacle_tracker_node:
  ros__parameters:
    data_dir: /data
    drive: 2011_09_26_drive_0005
    output_dir: /output
    report_every_n: 50          # live: write metrics.json every N processed frames
    seed: 42                    # RANSAC stream is seeded by [seed, stamp_ns]
    roi_x: [-40.0, 40.0]        # m, velodyne frame
    roi_y: [-20.0, 20.0]
    roi_z: [-3.0, 2.0]
    ego_box: [2.5, 1.5]         # drop |x| < a and |y| < b (the ego car)
    voxel_size: 0.15            # m; one grid-center point per occupied voxel
    ransac_iters: 100
    ransac_dist: 0.2            # m, plane inlier distance
    ransac_min_normal_z: 0.9    # accept only near-horizontal planes (|n_z| > this)
    ground_tile_size: 10.0      # m; local ground plane per tile, refined from the global plane
    ground_tile_band: 0.6       # m; tile candidates lie within this height of the global plane
    ground_tile_min_points: 30  # voxels a tile needs to fit its own plane (else it keeps the global one)
    ground_tile_trim: 0.15      # m; tile fit is trimmed to voxels this close to its plane
    dbscan_eps: 0.6             # m, clustering on (x, y)
    dbscan_min_samples: 8
    cluster_min_points: 10      # voxelized non-ground points per cluster
    max_length: 7.0             # m, oriented (min-area rectangle)
    max_width: 3.0              # m, oriented
    min_height: 0.3             # m, z extent
    max_height: 3.0
    # Phase 3: tracking. Defaults fixed before any tracking code ran (phase-3 FEATURE_SPEC D8).
    gate_m: 2.0                 # m, association gate on predicted-to-detection distance
    confirm_hits: 3             # hits before a track is confirmed (output and drawn)
    max_misses: 5               # consecutive misses (missing frames included) that delete a track
    q_accel: 1.0                # (m/s^2)^2, white-noise acceleration per axis
    r_pos: 0.5                  # m, measurement standard deviation of a detection center
    v0_sigma: 5.0               # m/s, initial velocity uncertainty (new tracks start at v = 0)
    moving_speed: 0.7           # m/s; a confirmed track is "moving" if speed - moving_sigma * sigma_speed > this
    moving_sigma: 2.0           # sigma_speed = filter velocity std along the direction of travel (decided Nov 6, D10)
    ego_compensation: true      # false: track in the velodyne frame (the no-ego ablation)
    association: hungarian      # hungarian | greedy (greedy is the Phase 6 ablation)
    warmup_frames: 5            # evaluation only: frames after confirmation excluded from speed scoring
